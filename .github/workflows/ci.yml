name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: 测试与静态检查 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: 格式检查
        run: cargo fmt --check

      - name: Clippy（零告警基线）
        run: cargo clippy --all-targets -- -D warnings

      # runner 预装了 Maven + Java，真实 Maven 端到端测试会执行；
      # 本地没有 Maven 时该测试自动跳过。
      - name: 运行全部测试
        run: cargo test --locked

  build:
    name: 构建 ${{ matrix.artifact }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: maven-util
            artifact: maven-util-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: maven-util.exe
            artifact: maven-util-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 打包二进制与配置示例
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md dist/
          cp maven-uploader.example.toml dist/maven-uploader.example.toml
          cp maven-uploader.windows.toml.example dist/ 2>/dev/null || true
          # 便于校验产物
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum * > SHA256SUMS)
          else
            (cd dist && shasum -a 256 * > SHA256SUMS)
          fi
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
          retention-days: 30
