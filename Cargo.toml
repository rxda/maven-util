[package]
name = "maven-util"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"      # 解析 Components API 查询响应（原本已随 reqwest 编译进来）
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "1.0.4"   # 根证书
rayon = "1.8"
jwalk = "0.8"
indicatif = "0.18"
crossbeam-channel = "0.5"
dashmap = "6.1"
redb = "3.1"
# 注意：alpha 依赖，默认保留纯 Rust TLS（不引入 C 代码）。如需改为稳定提供者，
# 可换用 rustls 的 ring/aws-lc-rs provider，见 README「依赖说明」。
rustls-rustcrypto = "0.0.2-alpha"
sha1 = "0.10"            # Maven checksum 计算，替代手写 SHA-1

[profile.release]
# 1. 优化级别：'z' 专门优化体积，'s' 兼顾速度和体积
opt-level = 'z'

# 2. 开启 LTO (Link Time Optimization)
# 让编译器跨 Crate 进行全局优化，能剔除更多无用代码
lto = true

# 3. 减少并行编译单元
# 设为 1 可以增加编译器优化机会，但编译速度会变慢
codegen-units = 1


# 5. 剥离调试符号 (Rust 1.59+)
# 相当于执行了外部的 strip 命令
strip = true
